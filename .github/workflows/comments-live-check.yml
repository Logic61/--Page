name: Verify the miwen production repair
on:
  pull_request:
    types: [reopened, synchronize]
permissions: {}
jobs:
  miwen:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check article cards and deployed CSS
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { setTimeout as delay } from 'node:timers/promises';
          const root = 'https://logic61.github.io/--Page/miwen/';
          const get = (url) => fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(8000) });
          const missing = new Set();
          for (let i = 0; i < 15; i++) {
            try {
              const res = await get(root + '?deployment-check=' + Date.now());
              assert.equal(res.status, 200);
              const html = await res.text();
              assert.equal([...html.matchAll(/<a\b[^>]*class="post-card\b/g)].length, 11, 'article count');
              assert.ok(html.includes('data-comments'), 'comments');
              const sheets = [...html.matchAll(/<link[^>]*href="([^"]+\.css)"/g)].map(m => new URL(m[1], root));
              const css = (await Promise.all(sheets.map(async uri => (await get(uri)).text()))).join('\n');
              const markupAndCSS = html + css;
              for (const name of ['miwen-list', 'post-list', 'post-card', 'miwen-notice']) assert.ok(markupAndCSS.includes('.' + name), 'missing CSS for ' + name);
              assert.doesNotMatch(markupAndCSS, /tokens truncated/);
              console.log('Live miwen page has 11 cards, restored styles, and anonymous comments.');
              process.exit(0);
            } catch (error) {
              missing.add(error.message);
              console.log('Waiting for Pages on attempt ' + (i + 1) + ': ' + error.message);
            }
            await delay(6000);
          }
          throw new Error([...missing].join('; '));
          JS
